<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HIRANYA ROYALE — Luxury Residences in Whitefield, Bengaluru</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Roboto,Arial,sans-serif}
html{scroll-behavior:smooth}
body{background:#faf8f5;color:#1c1917;line-height:1.6}

/* Prestige Sticky Navigation */
nav{background:#ffffff;padding:14px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #c59b27;position:sticky;top:0;z-index:100;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.brand{display:flex;flex-direction:column}
.logo{font-size:21px;font-weight:900;color:#042f2e;letter-spacing:1.5px}
.sub-logo{font-size:10px;color:#9a7b2c;font-weight:800;letter-spacing:2px;text-transform:uppercase}
.nav-menu{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.nav-menu a{text-decoration:none;color:#1c1917;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.nav-menu a:hover{color:#9a7b2c}
.nav-cta{background:linear-gradient(135deg,#d4af37,#b48a1e);color:#fff;border:none;padding:10px 20px;border-radius:30px;font-weight:800;font-size:12px;letter-spacing:.5px;cursor:pointer;text-transform:uppercase}

/* 1. FULL-VIEW HERO BANNER */
.hero{background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,.1) 45%,rgba(0,0,0,.85) 100%),url('./Assetz-City-of-Palms-7.jpg') center/cover no-repeat;min-height:92vh;padding:85px 6% 55px;display:flex;flex-direction:column;justify-content:space-between;text-align:center;color:#fff;border-bottom:4px solid #c59b27}
.hero-head{max-width:860px;margin:0 auto}
.rera-badge{display:inline-block;background:rgba(4,47,46,.85);border:1px solid #fde047;color:#fde047;padding:5px 16px;border-radius:30px;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:16px}
.hero h1{font-size:52px;font-weight:900;line-height:1.15;margin-bottom:14px;text-shadow:0 4px 22px rgba(0,0,0,.85)}
.hero h1 span{color:#fde047}
.hero p{font-size:20px;color:#ffffff;font-weight:500;text-shadow:0 3px 14px rgba(0,0,0,.95)}

/* Circular Outline Icons */
.icon-row{display:flex;justify-content:center;gap:38px;flex-wrap:wrap;margin:32px auto 26px}
.icon-item{display:flex;flex-direction:column;align-items:center;gap:8px}
.circle{width:72px;height:72px;border-radius:50%;border:2px solid rgba(255,255,255,.9);background:rgba(0,0,0,.28);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center}
.circle svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-item span{font-size:14px;font-weight:700;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.9)}

/* Pill CTAs */
.cta-row{display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
.pill-gold{background:linear-gradient(90deg,#d4af37,#f3d27a,#c59b27);color:#1c1917;border:none;padding:15px 38px;border-radius:50px;font-size:15px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;cursor:pointer;box-shadow:0 10px 28px rgba(0,0,0,.45)}
.pill-dark{background:rgba(4,47,46,.9);color:#fde047;border:1.5px solid #fde047;padding:14px 30px;border-radius:50px;font-size:14px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;cursor:pointer}

/* Shared Section Container */
.sec{max-width:1140px;margin:75px auto;padding:0 20px}
.sec-title{text-align:center;margin-bottom:40px}
.sec-title span{color:#9a7b2c;font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
.sec-title h2{font-size:34px;color:#042f2e;margin-top:5px;font-weight:800}
.bar{width:60px;height:3px;background:#c59b27;margin:12px auto 0}

/* 2. ABOUT & PROJECT DETAILS */
.about-box{background:#fff;border:1px solid #e7e5e4;border-radius:14px;padding:38px 30px;box-shadow:0 10px 30px rgba(0,0,0,.05)}
.about-text{max-width:820px;margin:0 auto 30px;text-align:center;font-size:16px;color:#44403c}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px;text-align:center;border-top:1px solid #e7e5e4;padding-top:26px}
.stats-grid h3{font-size:28px;color:#042f2e;font-weight:900}
.stats-grid p{font-size:12px;color:#78716c;font-weight:800;text-transform:uppercase;letter-spacing:1px}

/* 3. PLANS & CONFIGURATIONS */
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:24px}
.plan-card{background:#fff;padding:30px 24px;border-radius:12px;border:1px solid #e7e5e4;border-top:4px solid #042f2e;box-shadow:0 8px 22px rgba(0,0,0,.05)}
.badge{display:inline-block;background:#f0fdf4;color:#042f2e;border:1px solid #bbf7d0;padding:4px 12px;border-radius:4px;font-size:12px;font-weight:700;margin-bottom:12px}
.plan-card h3{font-size:22px;color:#042f2e;margin-bottom:8px}
.plan-card p{font-size:15px;color:#57534e;margin-bottom:16px}
.spec{background:#faf8f5;padding:12px;border-left:3px solid #c59b27;font-size:14px;font-weight:700;margin-bottom:18px}
.card-btn{width:100%;background:#042f2e;color:#fde047;border:1.5px solid #c59b27;padding:12px;border-radius:6px;font-weight:800;cursor:pointer;font-size:14px}

/* 4. SEAMLESS LOOP WALKTHROUGH VIDEO SECTION */
.video-sec{position:relative;border-radius:18px;overflow:hidden;min-height:460px;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;border:2px solid #c59b27;background:#042f2e}
.bg-video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:0}
.video-overlay{position:relative;z-index:2;background:rgba(4,47,46,.68);backdrop-filter:blur(3px);padding:48px 28px;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.video-overlay h2{font-size:36px;color:#fde047;margin-bottom:12px}
.video-overlay p{font-size:17px;max-width:650px;margin:0 auto 26px;color:#f1f5f9}

/* 5. AMENITIES & BENEFITS */
.ben-box{background:linear-gradient(135deg,#042f2e,#065f46);color:#fff;padding:50px 30px;border-radius:16px}
.ben-box h2{color:#fde047}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.b-card{background:rgba(255,255,255,.07);border:1px solid rgba(253,224,71,.35);padding:24px;border-radius:10px}
.b-card h4{color:#fde047;font-size:18px;margin-bottom:6px}
.b-card p{color:#e2e8f0;font-size:14px}

/* 6. GALLERY SHOWCASE */
.gal-card{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #e7e5e4;box-shadow:0 8px 20px rgba(0,0,0,.05)}
.gal-visual{height:190px;background:linear-gradient(rgba(4,47,46,.35),rgba(4,47,46,.65)),url('./Assetz-City-of-Palms-7.jpg') center/cover;display:flex;align-items:flex-end;padding:18px;color:#fde047;font-weight:800;font-size:18px}
.gal-body{padding:18px;font-size:14px;color:#57534e}

/* 7. LOCATION CONNECTIVITY */
.loc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}
.loc-card{background:#fff;padding:24px;border-radius:10px;text-align:center;border-bottom:4px solid #c59b27;box-shadow:0 6px 18px rgba(0,0,0,.05)}
.loc-card h3{font-size:28px;color:#9a7b2c;font-weight:900}
.loc-card p{font-size:14px;color:#042f2e;font-weight:700;margin-top:4px}

/* 8. FINAL CTA */
.final-cta{background:linear-gradient(rgba(4,47,46,.85),rgba(4,47,46,.92)),url('./Assetz-City-of-Palms-7.jpg') center/cover;color:#fff;padding:58px 24px;border-radius:16px;text-align:center;border:2px solid #c59b27}
.final-cta h2{font-size:34px;color:#fde047;margin-bottom:12px}
.final-cta p{font-size:17px;max-width:640px;margin:0 auto 26px}

/* Prestige Floating Bottom Bar */
.float-bar{position:fixed;bottom:0;left:0;width:100%;background:#042f2e;border-top:2px solid #c59b27;padding:10px 6%;display:flex;justify-content:center;gap:14px;z-index:95}
.float-btn{background:linear-gradient(135deg,#d4af37,#b48a1e);color:#fff;border:none;padding:10px 22px;border-radius:4px;font-weight:800;font-size:13px;cursor:pointer;text-transform:uppercase}
.float-btn-out{background:transparent;color:#fde047;border:1px solid #fde047;padding:10px 22px;border-radius:4px;font-weight:700;font-size:13px;cursor:pointer;text-transform:uppercase}

/* Prestige Popup Modal */
.pop{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.82);justify-content:center;align-items:center;z-index:999}
.pop-in{background:#fff;padding:30px 26px;border-radius:12px;border-top:5px solid #c59b27;max-width:410px;width:90%;text-align:left;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.cls{position:absolute;top:10px;right:16px;font-size:28px;cursor:pointer;color:#042f2e;font-weight:bold}
.pop-in h3{color:#042f2e;font-size:22px;margin-bottom:4px;text-align:center}
.pop-sub{font-size:13px;color:#57534e;margin-bottom:14px;text-align:center}
.pop-in input,.pop-in select{width:100%;padding:11px 12px;margin:7px 0;border:1.5px solid #d6d3d1;border-radius:6px;font-size:14px}
.chk{display:flex;align-items:center;gap:8px;font-size:12px;color:#44403c;margin:10px 0 14px}
.chk input{width:auto;margin:0}

footer{background:#02201f;color:#a8a29e;text-align:center;padding:28px 20px 75px;margin-top:60px;font-size:13px}
@media(max-width:850px){.nav-menu a{display:none}.hero h1{font-size:34px}.icon-row{gap:20px}.pill-gold,.pill-dark{padding:13px 24px;font-size:14px}}
</style>
</head>
<body>

<nav>
  <div class="brand">
    <span class="logo">HIRANYA ROYALE</span>
    <span class="sub-logo">Whitefield • Bengaluru</span>
  </div>
  <div class="nav-menu">
    <a href="#about">About</a>
    <a href="#plans">Plans</a>
    <a href="#walkthrough">Walkthrough Video</a>
    <a href="#amenities">Amenities</a>
    <a href="#gallery">Gallery</a>
    <a href="#location">Location</a>
    <button class="nav-cta" onclick="openForm('Enquire Now')">Enquire Now</button>
  </div>
</nav>

<section class="hero">
  <div class="hero-head">
    <div class="rera-badge">RERA Approved Luxury Township • Whitefield</div>
    <h1>A Home That Speaks <span>Your Success.</span></h1>
