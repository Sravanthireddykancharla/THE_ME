<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HIRANYA ROYALE — Signature Luxury Residences in Whitefield, Bengaluru</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    html { scroll-behavior: smooth; }
    body { background-color: #faf8f5; color: #1c1917; line-height: 1.65; }

    /* Top Luxury Builder Navbar */
    nav {
      background: #ffffff;
      padding: 15px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #d4af37;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }
    .brand { display: flex; flex-direction: column; }
    .logo { font-size: 22px; font-weight: 900; color: #042f2e; letter-spacing: 1.5px; }
    .sub-logo { font-size: 11px; color: #9a7b2c; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
    .nav-links { display: flex; gap: 22px; align-items: center; }
    .nav-links a { text-decoration: none; color: #042f2e; font-size: 14px; font-weight: 700; }
    .nav-btn {
      background: #042f2e;
      color: #fde047;
      padding: 10px 22px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 14px;
      border: 1.5px solid #d4af37;
      cursor: pointer;
    }

    /* 1. HERO SECTION WITH YOUR EXACT Assetz-City-of-Palms-7.jpg PHOTO */
    .hero {
      position: relative;
      background-color: #042f2e;
      color: #ffffff;
      padding: 85px 6% 105px;
      border-bottom: 4px solid #d4af37;
      overflow: hidden;
    }
    .hero-bg-img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 0;
      opacity: 0.48;
    }
    .hero-gradient {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, rgba(4, 47, 46, 0.88) 0%, rgba(4, 47, 46, 0.72) 60%, rgba(4, 47, 46, 0.65) 100%);
      z-index: 1;
    }
    .hero-inner {
      position: relative;
      z-index: 2;
      max-width: 1140px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.25fr 0.95fr;
      gap: 42px;
      align-items: center;
    }
    .rera-tag {
      display: inline-block;
      background: rgba(212, 175, 55, 0.22);
      border: 1px solid #d4af37;
      color: #fde047;
      padding: 6px 16px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 18px;
    }
    .hero h1 {
      font-size: 46px;
      font-weight: 900;
      line-height: 1.15;
      margin-bottom: 16px;
      color: #ffffff;
    }
    .hero h1 span { color: #fde047; }
    .hero p {
      font-size: 18px;
      color: #f1f5f9;
      margin-bottom: 28px;
      max-width: 560px;
    }

    /* 5. WORKING ENQUIRY FORM CARD */
    .form-card {
      background: #ffffff;
      color: #1c1917;
      padding: 32px 28px;
      border-radius: 12px;
      border-top: 5px solid #d4af37;
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.4);
    }
    .form-card h3 { font-size: 22px; color: #042f2e; font-weight: 800; margin-bottom: 4px; }
    .form-card p { font-size: 13px; color: #57534e; margin-bottom: 18px; }
    .form-group { margin-bottom: 14px; text-align: left; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; color: #042f2e; margin-bottom: 5px; text-transform: uppercase; }
    .form-group input, .form-group select {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #d6d3d1;
      border-radius: 6px;
      font-size: 14px;
      color: #1c1917;
      background: #fafaf9;
    }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: #042f2e; background: #ffffff; }

    /* Buttons & CTAs */
    .btn-row { display: flex; gap: 14px; flex-wrap: wrap; }
    .btn-gold {
      background: linear-gradient(135deg, #d4af37, #b48a1e);
      color: #ffffff;
      border: none;
      padding: 14px 26px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: 0.4px;
      box-shadow: 0 8px 20px rgba(180, 138, 30, 0.35);
    }
    .btn-outline-light {
      background: rgba(4, 47, 46, 0.65);
      color: #fde047;
      border: 1.5px solid #fde047;
      padding: 13px 24px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-full { width: 100%; text-align: center; display: block; margin-top: 6px; }

    /* 2. SOCIAL PROOF STRIP */
    .social-proof { max-width: 1140px; margin: -45px auto 65px; padding: 0 20px; position: relative; z-index: 10; }
    .proof-grid {
      background: #ffffff;
      border: 1px solid #e7e5e4;
      border-bottom: 4px solid #d4af37;
      border-radius: 10px;
      padding: 28px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      text-align: center;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
    }
    .proof-item h3 { font-size: 30px; color: #042f2e; font-weight: 900; }
    .proof-item p { font-size: 13px; color: #78716c; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

    /* Shared Section Styles */
    .container { max-width: 1140px; margin: 75px auto; padding: 0 20px; }
    .sec-head { text-align: center; margin-bottom: 45px; }
    .sec-head span { color: #9a7b2c; font-size: 13px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
    .sec-head h2 { font-size: 34px; color: #042f2e; margin-top: 6px; font-weight: 800; }
    .divider { width: 60px; height: 3px; background: #d4af37; margin: 14px auto 0; }

    /* 3. KEY HIGHLIGHTS (RESIDENCES) */
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 28px; }
    .config-card {
      background: #ffffff;
      border: 1px solid #e7e5e4;
      border-radius: 12px;
      padding: 32px 26px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.04);
      transition: transform 0.25s, border-color 0.25s;
    }
    .config-card:hover { transform: translateY(-5px); border-color: #d4af37; }
    .config-tag {
      display: inline-block;
      background: #f0fdf4;
      color: #042f2e;
      border: 1px solid #bbf7d0;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 14px;
    }
    .config-card h3 { font-size: 23px; color: #042f2e; margin-bottom: 8px; }
    .config-card p { font-size: 15px; color: #57534e; margin-bottom: 20px; }
    .config-specs {
      background: #faf8f5;
      padding: 14px;
      border-radius: 8px;
      font-size: 14px;
      color: #1c1917;
      font-weight: 700;
      margin-bottom: 20px;
      border-left: 3px solid #d4af37;
    }

    /* 4. BENEFITS & AMENITIES */
    .benefits-wrap {
      background: #042f2e;
      color: #ffffff;
      border-radius: 16px;
      padding: 55px 34px;
    }
    .benefits-wrap .sec-head span { color: #fde047; }
    .benefits-wrap .sec-head h2 { color: #ffffff; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 22px; }
    .benefit-card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(212, 175, 55, 0.35);
      padding: 24px;
      border-radius: 10px;
    }
    .benefit-card h4 { color: #fde047; font-size: 18px; margin-bottom: 8px; }
    .benefit-card p { color: #e2e8f0; font-size: 14px; }

    /* 5. LOCATION ADVANTAGE */
    .loc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
    .loc-box {
      background: #ffffff;
      border: 1px solid #e7e5e4;
      border-top: 4px solid #042f2e;
      border-radius: 10px;
      padding: 24px 18px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
    }
    .loc-time { font-size: 28px; font-weight: 900; color: #9a7b2c; }
    .loc-name { font-size: 15px; color: #042f2e; font-weight: 700; margin-top: 6px; }

    /* 6. FINAL CTA WITH BACKGROUND PHOTO */
    .final-cta {
      position: relative;
      background-color: #042f2e;
      color: #ffffff;
      border: 2px solid #d4af37;
      border-radius: 16px;
      padding: 60px 28px;
      text-align: center;
      overflow: hidden;
    }
    .final-cta-content { position: relative; z-index: 2; }
    .final-cta h2 { font-size: 34px; color: #fde047; margin-bottom: 12px; }
    .final-cta p { font-size: 17px; color: #f1f5f9; max-width: 650px; margin: 0 auto 30px; }

    /* 4. POPUPS */
    .popup {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .popup-box {
      background: #ffffff;
      color: #1c1917;
      border-top: 6px solid #d4af37;
      border-radius: 14px;
      padding: 34px;
      max-width: 440px;
      width: 90%;
      text-align: center;
      position: relative;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
    }
    .close { position: absolute; top: 12px; right: 18px; font-size: 28px; color: #042f2e; cursor: pointer; font-weight: bold; }
    .popup-box h2 { color: #042f2e; margin-bottom: 12px; }
    .popup-box p { color: #44403c; font-size: 15px; line-height: 1.8; }
    .wa-btn {
      display: inline-block;
      margin-top: 20px;
      background: #16a34a;
      color: #ffffff;
      padding: 14px 28px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 800;
      width: 100%;
    }

    footer {
      background: #02201f;
      color: #a8a29e;
      text-align: center;
      padding: 30px 20px;
      margin-top: 70px;
      font-size: 13px;
    }
